spring.application.name=api-gateway
server.port=8090

# Wildlife Service - Port 8081
spring.cloud.gateway.server.webflux.routes[0].id=wildlife-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/wildlife/**

# Incident Service - Port 8082
spring.cloud.gateway.server.webflux.routes[1].id=incident-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/incidents/**

# Patrol Service - Port 8083
spring.cloud.gateway.server.webflux.routes[2].id=patrol-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/patrols/**

# Rescue Service - Port 8084
spring.cloud.gateway.server.webflux.routes[3].id=rescue-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/rescues/**

# Analytics Service - Port 8085
spring.cloud.gateway.server.webflux.routes[4].id=analytics-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/analytics/**

# Habitat Service - Port 8086
spring.cloud.gateway.server.webflux.routes[5].id=habitat-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/protected-areas/**,/api/habitats/**

# Staff and Resource Service - Port 8087
spring.cloud.gateway.server.webflux.routes[6].id=staff-resource-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/staff/**,/api/resources/**

# Conservation Programme Service - Port 8088
spring.cloud.gateway.server.webflux.routes[7].id=conservation-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/conservation-programmes/**

# CORS configuration
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:8080
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=false

# Remove duplicate CORS response headers
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST